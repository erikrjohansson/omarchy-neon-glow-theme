# Omarchy shell surfaces. Colors derive from colors.toml; sizes and the
# typographic scale come from the keys below. Themes can ship
# themes/<name>/shell.toml to replace this generated file.

[bar]
background = "#0b110a"
background-alpha = 0.98
text = "#c9cbc8"
active = "#83ce6e"
scale-with-font = true
size-horizontal = 26
size-vertical = 28
[hyprland]
# Shared Hyprland-derived border tokens. Surface sections reference these so
# lock, notifications, popups, and menu-style cards stay aligned with the
# current Hyprland active-border gradient.
active-border            = "rgba(538246ee)"
active-border-foreground = "rgba(538246ee)"

[controls]

normal-color        = "#c9cbc8"
normal-fill-alpha   = 0.04
normal-border       = "#c9cbc8"
normal-border-width = 1
normal-border-alpha = 0.4

hover-cursor-color        = "#83ce6e"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#c9cbc8"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.5

focus-color        = "#83ce6e"
focus-fill-alpha   = 0.08
focus-border       = "#83ce6e"
focus-border-width = 1
focus-border-alpha = 0.65

selected-color        = "#83ce6e"
selected-fill-alpha   = 0.18
selected-border       = "#c9cbc8"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35
[spacing]
# `scale` multiplies shared margins, gaps, padding, controls, and panel
# dimensions; components keep their proportions. With scale-with-font
# enabled, those dimensions grow/shrink with [font] base-size too. Per-token
# overrides (in px) below pin individual values without affecting the rest
# of the scale. Uncomment any to tune a specific surface.
scale = 1.0
scale-with-font = true
# xxs                       = 2
# xs                        = 3
# sm                        = 4
# md                        = 6
# lg                        = 8
# xl                        = 10
# xxl                       = 12
# xxxl                      = 14
# huge                      = 18
# control-gap               = 8
# control-padding-x         = 10
# control-padding-y         = 6
# input-padding-y           = 7
# control-height            = 28
# popup-row-height          = 28
# row-gap                   = 8
# row-padding-x             = 12
# label-gap                 = 4
# panel-gap                 = 14
# panel-padding             = 18
# popup-padding             = 14
# dropdown-width            = 240
# searchable-dropdown-width = 260
# number-field-width        = 120
# searchable-popup-min-height = 220

[font]
# base-size is the rem root for the type scale. Every Style.font.<token>
# derives from it (e.g. body = base, subtitle ≈ base * 1.083,
# heading ≈ base * 1.333). The shell only floors this at 1px; increase it
# as much as you want.
base-size = 12
# Per-token overrides, in px. Uncomment any to pin a specific size without
# affecting the rest of the scale. Useful for stylistic emphasis (a
# minimalist theme that wants a bigger heading without scaling everything).
# caption       = 10
# body-small    = 11
# body          = 12
# subtitle      = 13
# title         = 14
# heading       = 16
# display       = 24
# display-large = 28
# icon-small    = 11
# icon          = 14
# icon-large    = 18

[popups]
background       = "#0b110a"
background-alpha = 0.95
text             = "#c9cbc8"
border           = "hyprland.active-border"
border-alpha     = 1.0
[tooltip]
background       = "#0b110a"
background-alpha = 0.95
text             = "#c9cbc8"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0
[notifications]
background       = "#0b110a"
background-alpha = 1.0
text             = "#c9cbc8"
# Conventionally matches the Hyprland active-window border. Border accepts
# either a solid color or the full active-border gradient.
border           = "hyprland.active-border"
border-alpha     = 1.0
# border-width     = 2
countdown        = "#83ce6e"

[launcher]
background                = "#0b110a"
background-alpha          = 0.95
text                      = "#c9cbc8"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#151b14"
scrim-alpha               = 0.5
selected-background       = "#83ce6e"
selected-background-alpha = 0.18
selected-text             = "#83ce6e"
selected-border           = "#83ce6e"
selected-border-alpha     = 0.5
[menu]
background                = "#0b110a"
background-alpha          = 0.95
text                      = "#c9cbc8"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#151b14"
scrim-alpha               = 0.5
selected-background       = "#83ce6e"
selected-background-alpha = 0.18
selected-text             = "#83ce6e"
selected-border           = "#83ce6e"
selected-border-alpha     = 0.5
[polkit]
background       = "#0b110a"
background-alpha = 0.95
text             = "#c9cbc8"
text-error       = "#eb817f"
border           = "hyprland.active-border"
border-error     = "#eb817f"
border-alpha     = 1.0
scrim            = "#0b110a"
scrim-alpha      = 0.5
accent           = "#83ce6e"
[lock]
background       = "#0b110a"
background-alpha = 0.95
text             = "#c9cbc8"
placeholder      = "#727f6f"
text-error       = "#eb817f"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#eb817f"
border-alpha     = 1.0
selection        = "#83ce6e"
selection-alpha  = 0.45
[image-picker]
scrim                   = "#0b110a"
scrim-alpha             = 0.5
text                    = "#c9cbc8"
selected-border         = "#83ce6e"
selected-border-alpha   = 1.0
unselected-border       = "#c9cbc8"
unselected-border-alpha = 0.28
